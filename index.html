<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Primary meta -->
    <title>Taiwo Bamgboye — Full-Stack & Mobile Engineer</title>
    <meta name="description" content="Taiwo Bamgboye is a full-stack and mobile engineer specialising in React, React Native, Node.js, and TypeScript. Based in Nigeria, building production-grade web and mobile applications." />
    <meta name="author" content="Taiwo Bamgboye" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d1117" />

    <!-- Canonical -->
    <link rel="canonical" href="https://taiwobamgboye.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taiwobamgboye.dev/" />
    <meta property="og:title" content="Taiwo Bamgboye — Full-Stack & Mobile Engineer" />
    <meta property="og:description" content="Full-stack and mobile engineer with 6+ years of experience building fintech, marketplace, and enterprise applications." />
    <meta property="og:image" content="https://taiwobamgboye.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Taiwo Bamgboye Portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Taiwo Bamgboye — Full-Stack & Mobile Engineer" />
    <meta name="twitter:description" content="Full-stack and mobile engineer with 6+ years of experience building fintech, marketplace, and enterprise applications." />
    <meta name="twitter:image" content="https://taiwobamgboye.dev/og-image.jpg" />

    <!-- Performance: preconnect to Google Fonts before CSS requests them -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: only the weights actually used (400, 600) instead of all 9 -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Structured data — helps search engines understand this is a developer portfolio -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Taiwo Bamgboye",
      "url": "https://taiwobamgboye.dev",
      "jobTitle": "Full-Stack & Mobile Engineer",
      "description": "Full-stack and mobile engineer specialising in React, React Native, Node.js and TypeScript with 6+ years of production experience.",
      "sameAs": [
        "https://github.com/taiwo-bamgboye",
        "https://linkedin.com/in/taiwo-bamgboye"
      ],
      "knowsAbout": [
        "React", "React Native", "Node.js", "TypeScript", "Next.js",
        "PostgreSQL", "Firebase", "Django", "AWS"
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

</html>
